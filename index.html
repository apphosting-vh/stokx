<script>
/* ══════════════════════════════════════════════════════════════════════
   INSTANT THEME — set data-mode & data-theme before CSS renders
   ══════════════════════════════════════════════════════════════════════ */
(function(){
  var THEMES={violet:0,indigo:0,blue:0,green:0,yellow:0,orange:0,red:0,
    "violet-dark":1,"indigo-dark":1,"blue-dark":1,"green-dark":1,
    "yellow-dark":1,"orange-dark":1,"red-dark":1};
  try{
    var t=localStorage.getItem("stox_theme_id");
    if(t&&THEMES.hasOwnProperty(t)){
      document.documentElement.setAttribute("data-theme",t);
      document.documentElement.setAttribute("data-mode",THEMES[t]?"dark":"light");
      if(THEMES[t])document.documentElement.style.setProperty("color-scheme","dark");
    }else{
      document.documentElement.setAttribute("data-theme","green");
      document.documentElement.setAttribute("data-mode","light");
    }
  }catch(e){
    document.documentElement.setAttribute("data-theme","green");
    document.documentElement.setAttribute("data-mode","light");
  }
  try{
    var f=localStorage.getItem("stox_font_id");
    if(f)document.documentElement.style.setProperty("--font-body",
      {inter:"'Inter',sans-serif","plus-jakarta-sans":"'Plus Jakarta Sans',sans-serif",
       manrope:"'Manrope',sans-serif",outfit:"'Outfit',sans-serif",
       "space-grotesk":"'Space Grotesk',sans-serif"}[f]||"'DM Sans',sans-serif");
  }catch(e){}
})();
</script>

<script>
/* ══════════════════════════════════════════════════════════════════════
   ALWAYS-FRESH STRATEGY
   ══════════════════════════════════════════════════════════════════════ */
(function(){
  var _selfCheckDone=false;
  function selfVersionCheck(){
    if(_selfCheckDone||!navigator.onLine)return;
    _selfCheckDone=true;
    var currentVer=(window.__STOX_APP_VERSION||'');
    fetch(location.href,{cache:'no-store',method:'GET'})
      .then(function(r){return r.text();})
      .then(function(html){
        var m=html.match(/STOX_APP_VERSION\s*=\s*"([^"]+)"/);
        if(m&&m[1]&&currentVer&&m[1]!==currentVer){
          window.location.reload();
        }
      })
      .catch(function(){});
  }
  window.addEventListener('load',function(){setTimeout(selfVersionCheck,2000);});
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){_selfCheckDone=false;selfVersionCheck();}
  });
  window.addEventListener('online',function(){_selfCheckDone=false;selfVersionCheck();});

  if(!('serviceWorker' in navigator))return;
  window.__swReg=null;
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'})
      .then(function(reg){
        window.__swReg=reg;
        function notifyUpdateReady(){window.dispatchEvent(new CustomEvent('stox:update-ready'));}
        if(reg.waiting)notifyUpdateReady();
        reg.addEventListener('updatefound',function(){
          var nw=reg.installing;if(!nw)return;
          nw.addEventListener('statechange',function(){
            if(nw.state==='installed'&&navigator.serviceWorker.controller)notifyUpdateReady();
          });
        });
        function swUpdate(){if(navigator.onLine)reg.update().catch(function(){});}
        swUpdate();
        document.addEventListener('visibilitychange',function(){
          if(document.visibilityState==='visible')swUpdate();
        });
        window.addEventListener('online',swUpdate);
        setInterval(swUpdate,10*60*1000);
        navigator.serviceWorker.addEventListener('controllerchange',function(){
          if(!window.__swReloaded){window.__swReloaded=true;window.location.reload();}
        });
      })
      .catch(function(){});
  });
}());
</script>

<script>
/* ══════════════════════════════════════════════════════════════════════
   APP PROTECTION LAYER
   ══════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  if(window.self!==window.top){
    document.documentElement.innerHTML='';
    try{window.top.location=window.self.location;}catch(e){}
    throw new Error('Embedding blocked');
  }
  window.addEventListener('DOMContentLoaded',function(){
    var TRUSTED=['cdnjs.cloudflare.com','fonts.googleapis.com','fonts.gstatic.com','accounts.google.com'];
    var obs=new MutationObserver(function(muts){
      muts.forEach(function(m){
        m.addedNodes.forEach(function(node){
          if(node.nodeName==='SCRIPT'&&node.src){
            var trusted=TRUSTED.some(function(d){return node.src.indexOf(d)!==-1;});
            if(!trusted)node.remove();
          }
        });
      });
    });
    obs.observe(document.documentElement,{childList:true,subtree:true});
  });
})();
</script>

/* ════════════════════════════════════════════════
   THEME SWATCH GRID
   ════════════════════════════════════════════════ */
.stx-theme-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 8px;
}
.stx-theme-swatch {
  display: flex; flex-direction: column; align-items: center; padding: 10px 6px;
  border-radius: 12px; border: 2px solid var(--border); cursor: pointer;
  transition: border-color .18s, box-shadow .18s;
  background: transparent;
}
.stx-theme-swatch:hover { border-color: var(--accent); }
.stx-theme-swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accentbg5); }
.stx-theme-swatch-preview {
  width: 100%; height: 36px; border-radius: 8px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;transition:background .3s,color .3s}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16.1px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--scrolltrack)}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--scrollbar2)}

.inp{width:100%;box-sizing:border-box;background:var(--inp-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 14px;font-family:var(--font-body);font-size:16.1px;outline:none;transition:border-color .2s,box-shadow .2s,background .3s,color .3s}
.inp:hover{border-color:var(--border3)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg3)}
.inp::placeholder{color:var(--text5)}

/* ── Shared card styles ── */
.stx-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-sm);transition:box-shadow .25s,border-color .25s,transform .2s}
.stx-card:hover{border-color:var(--border2);box-shadow:var(--shadow-md)}

.stx-statcard{animation:stxFadeIn .42s ease both;transition:transform .2s ease,box-shadow .25s ease,border-color .2s ease}
.stx-statcard:nth-child(1){animation-delay:0ms}
.stx-statcard:nth-child(2){animation-delay:60ms}
.stx-statcard:nth-child(3){animation-delay:120ms}
.stx-statcard:nth-child(4){animation-delay:180ms}
.stx-statcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border3)}

/* ── Buttons ── */
.stx-btn{padding:8px 16px;border-radius:var(--r-sm);cursor:pointer;font-family:var(--font-body);font-size:15px;font-weight:600;transition:all .15s;border:1px solid transparent;white-space:nowrap}
.stx-btn:hover:not([disabled]){transform:translateY(-1px);box-shadow:var(--shadow-sm);filter:saturate(1.05)}
.stx-btn:active:not([disabled]){transform:translateY(0) scale(.98)}
.stx-btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accentbg3)}
.stx-btn:disabled{opacity:.38;cursor:not-allowed}
.stx-btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.stx-btn-primary:hover:not([disabled]){background:var(--accent2)}
.stx-btn-ghost{background:transparent;color:var(--text4);border-color:var(--border)}
.stx-btn-ghost:hover:not([disabled]){background:var(--accentbg2);color:var(--accent);border-color:var(--accentbg5)}
select.inp option{background:var(--inp-opt)}
textarea.inp{resize:vertical}
.inp:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg3)}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Tags/Badges ── */
.stx-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;letter-spacing:.2px}
.stx-profit{color:var(--profit);background:var(--profitbg);border:1px solid var(--profitborder)}
.stx-loss{color:var(--loss);background:var(--lossbg);border:1px solid var(--lossborder)}
.stx-warn{color:var(--warn);background:var(--warnbg);border:1px solid var(--warnborder)}
.stx-info{color:var(--info);background:var(--infobg);border:1px solid var(--infoborder)}

/* ── Tables ── */
.stx-table{width:100%;border-collapse:collapse;font-size:15px}
.stx-table th{text-align:left;padding:10px 14px;font-size:11.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;background:var(--bg4);border-bottom:2px solid var(--border)}
.stx-table td{padding:10px 14px;border-bottom:1px solid var(--border2);font-family:var(--font-body);font-size:15px;vertical-align:middle;color:var(--text3)}
.stx-table tr:last-child td{border-bottom:none}
.stx-table tr:hover td{background:var(--accentbg2)}

/* ── Mobile bottom nav ── */
.stx-botnav{display:none}
@media(max-width:768px){
  .stx-botnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:900;
    background:var(--bg3);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -4px 20px rgba(0,0,0,.10);
  }
  .stx-botnav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:transparent;border:none;cursor:pointer;padding:5px 2px;border-radius:10px;
    color:var(--text5);font-family:var(--font-body);font-size:11px;font-weight:600;
    letter-spacing:.1px;transition:color .18s,background .18s;min-width:0;
  }
  .stx-botnav-item.active{color:var(--accent)}
  .stx-botnav-item.active svg{transform:scale(1.16);filter:drop-shadow(0 0 4px var(--accentbg5))}
  .stx-botnav-item:active{background:var(--accentbg2)}
  .stx-has-botnav{padding-bottom:76px!important}
}

/* ── Modal ── */
.modal-bd{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--overlay);z-index:1000;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:stxFadeIn .3s ease both}
@media(max-width:768px){
  .modal-bd{left:0!important}
  .modal-bd .fu{width:100%;max-width:100%!important;max-height:calc(100dvh - 48px);overflow-y:auto;-webkit-overflow-scrolling:touch}
}

/* ── Selection system ── */
::selection{background:var(--accentbg5);color:var(--accent)}
::-moz-selection{background:var(--accentbg5);color:var(--accent)}

/* ── Animations ── */
@keyframes stxFadeIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes stxSlideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes stxSpin{to{transform:rotate(360deg)}}
@keyframes stxShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes stxPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.45);opacity:1}}
@keyframes stxLineDraw{to{stroke-dashoffset:0}}

.stx-fu{animation:stxFadeIn .35s ease forwards}
.stx-si{animation:stxSlideIn .25s ease forwards}

/* ── Toast host ── */
.stx-toast-host{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2000;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:max-content;max-width:80vw}
.stx-toast{display:flex;align-items:flex-start;gap:12px;pointer-events:auto;background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:var(--font-body);font-size:15px;color:var(--text);animation:stxFadeIn .25s ease;max-width:70vw;line-height:1.5;word-wrap:break-word;flex-wrap:wrap}
.stx-toast-msg{flex:1;min-width:0;min-width:200px}
.stx-toast-close{background:transparent;border:none;color:var(--text5);cursor:pointer;font-size:21px;line-height:1;padding:2px 6px;border-radius:6px;flex-shrink:0}
.stx-toast-action{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:13.8px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.stx-toast-action:hover{opacity:.85}

/* ── Sidebar ── */
.stx-sidebar{transition:width .2s cubic-bezier(.4,0,.2,1),min-width .2s cubic-bezier(.4,0,.2,1)}

/* ── Responsive modals ── */
@media(max-width:420px){
  .modal-bd{padding:8px 4px!important}
  .modal-bd .fu{padding:16px 12px!important}
}

/* ── Chart area ── */
.stx-chart-line{transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1);stroke-dasharray:1400;stroke-dashoffset:1400;animation:stxLineDraw 1.1s cubic-bezier(.4,0,.2,1) forwards}

/* ── Reports tabs scrollbar hiding ── */
.reports-tabs-scroll::-webkit-scrollbar{display:none}
.reports-tabs-scroll{scrollbar-width:none}

/* ── Mobile scroll tables ── */
.mobile-scroll-table{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:9px}

/* ── Grid helpers ── */
.grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid-2col{grid-template-columns:1fr}}

/* ── Theme crossfade ── */
html,body,.stx-card,.stx-statcard,.stx-btn,.inp,.stx-botnav,.stx-botnav-item,
.stx-sidebar,.stx-toast,.modal-bd,.fu,input,select,button,textarea{
  transition:background-color .35s ease,color .35s ease,border-color .35s ease,box-shadow .35s ease
}

/* ── Tr hover utility ── */
.tr:hover{background:var(--accentbg2) !important}

/* ── Responsive mobile content ── */
@media(max-width:768px){
  .mobile-content-panel{padding:14px 10px 32px !important}
}

/* ── Print ── */
@media print{
  html:not([data-stox-printing]) body *{visibility:hidden!important}
  html:not([data-stox-printing]) body::after{
    visibility:visible!important;content:"Printing is disabled for this application.";
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:20px;font-family:sans-serif;color:#333;
  }
}

#stox-splash::after{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(16,185,129,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(16,185,129,.03) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,black 20%,transparent 100%);
  pointer-events:none;opacity:.5;
}

/* ── Animated chart line ── */
.sp-chart-line{
  position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;
  animation:sp-fadeup .8s .3s ease both;
}
.sp-chart-path{
  fill:none;stroke:url(#sp-gradient);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1600;stroke-dashoffset:1600;
  animation:sp-draw 2.8s .5s cubic-bezier(.4,0,.2,1) forwards;
}
.sp-chart-area{
  fill:url(#sp-area-gradient);opacity:0;
  animation:sp-fadeup 1.2s 2s ease both;
}
.sp-chart-dot{
  fill:#10b981;opacity:0;
  animation:sp-fadeup .4s 2.6s ease both,sp-pulse 2s 3s ease-in-out infinite;
}

/* ── Background floating dots ── */
.sp-bg-dots{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sp-bg-dot{
  position:absolute;border-radius:50%;background:rgba(16,185,129,.35);
}
.sp-bg-dot:nth-child(1){width:5px;height:5px;top:15%;left:12%;animation:sp-dot-float 6s ease-in-out infinite}
.sp-bg-dot:nth-child(2){width:3px;height:3px;top:28%;left:82%;animation:sp-dot-float 7.5s .8s ease-in-out infinite;background:rgba(37,99,235,.3)}
.sp-bg-dot:nth-child(3){width:4px;height:4px;top:65%;left:25%;animation:sp-dot-float 8s 1.5s ease-in-out infinite}
.sp-bg-dot:nth-child(4){width:3px;height:3px;top:72%;left:75%;animation:sp-dot-float 6.5s .4s ease-in-out infinite;background:rgba(5,150,105,.3)}
.sp-bg-dot:nth-child(5){width:4px;height:4px;top:42%;left:90%;animation:sp-dot-float 7s 2s ease-in-out infinite}
.sp-bg-dot:nth-child(6){width:3px;height:3px;top:85%;left:55%;animation:sp-dot-float 9s 1s ease-in-out infinite;background:rgba(37,99,235,.25)}
.sp-bg-dot:nth-child(7){width:5px;height:5px;top:10%;left:60%;animation:sp-dot-float 7.5s 1.2s ease-in-out infinite}
.sp-bg-dot:nth-child(8){width:3px;height:3px;top:50%;left:8%;animation:sp-dot-float 8.5s .6s ease-in-out infinite;background:rgba(5,150,105,.25)}

/* ── Connecting lines between dots ── */
.sp-lines{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sp-lines svg{width:100%;height:100%}
.sp-line{stroke:rgba(16,185,129,.08);stroke-width:1;animation:sp-line-pulse 4s ease-in-out infinite}
.sp-line:nth-child(2){animation-delay:1.3s}
.sp-line:nth-child(3){animation-delay:2.6s}

/* ── Center content ── */
.sp-center{
  position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
}

/* ── Logo mark ── */
.sp-logo{
  width:72px;height:72px;border-radius:20px;position:relative;
  background:linear-gradient(135deg,#10b981 0%,#059669 50%,#047857 100%);
  display:flex;align-items:center;justify-content:center;
  animation:sp-scale .6s .15s ease both;opacity:0;
  box-shadow:0 8px 32px rgba(16,185,129,.25),0 2px 8px rgba(16,185,129,.15);
  margin-bottom:28px;
}
.sp-logo::before{
  content:'';position:absolute;inset:-8px;border-radius:24px;
  border:1px solid rgba(16,185,129,.15);
  animation:sp-ring 2.5s .8s ease-out infinite;
}
.sp-logo::after{
  content:'';position:absolute;inset:-16px;border-radius:28px;
  border:1px solid rgba(16,185,129,.08);
  animation:sp-ring 2.5s 1.4s ease-out infinite;
}
.sp-logo-letter{
  font-size:30px;font-weight:900;color:#fff;line-height:1;
  text-shadow:0 2px 8px rgba(0,0,0,.15);
  font-family:'Sora',system-ui,sans-serif;
}

/* ── Wordmark ── */
.sp-wordmark{
  display:flex;gap:1px;margin-bottom:8px;
}
.sp-wm-char{
  font-size:42px;font-weight:800;color:#0a1628;letter-spacing:-1.5px;line-height:1;
  font-family:'Sora',system-ui,sans-serif;
  opacity:0;animation:sp-char .45s ease both;
}
.sp-wm-char:nth-child(1){animation-delay:.25s}
.sp-wm-char:nth-child(2){animation-delay:.32s}
.sp-wm-char:nth-child(3){animation-delay:.39s}
.sp-wm-char.accent{
  background:linear-gradient(135deg,#10b981,#059669);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

/* ── Tagline ── */
.sp-tagline{
  font-size:11px;color:#6b7e9e;letter-spacing:3.5px;text-transform:uppercase;
  font-weight:600;opacity:0;animation:sp-fadeup .5s .6s ease both;
  font-family:'DM Sans','Sora',system-ui,sans-serif;
}

/* ── Progress ── */
.sp-progress{
  margin-top:44px;width:180px;height:2px;background:rgba(16,185,129,.1);
  border-radius:2px;overflow:hidden;opacity:0;animation:sp-fadeup .4s .85s ease both;
}
.sp-progress-fill{
  height:100%;border-radius:2px;width:0;
  background:linear-gradient(90deg,rgba(16,185,129,.4),#10b981,#059669);
  animation:sp-bar 2.6s .95s cubic-bezier(.4,0,.2,1) forwards;
  box-shadow:0 0 10px rgba(16,185,129,.35);
}
.sp-label{
  margin-top:14px;font-size:10px;color:#94a3be;letter-spacing:2.5px;
  text-transform:uppercase;font-weight:600;font-family:'DM Sans','Sora',system-ui,sans-serif;
  opacity:0;animation:sp-fadeup .4s 1s ease both;
}

/* ── Orbital ring ── */
.sp-orbit{
  position:absolute;width:120px;height:120px;top:50%;left:50%;
  margin:-60px 0 0 -60px;border-radius:50%;pointer-events:none;
  animation:sp-orbit 12s linear infinite;
  opacity:0;animation:sp-fadeup .6s .5s ease both,sp-orbit 12s .5s linear infinite;
}
.sp-orbit-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1px dashed rgba(16,185,129,.12);
}
.sp-orbit-node{
  position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;
  border-radius:50%;background:#10b981;
  box-shadow:0 0 8px 2px rgba(16,185,129,.4);
}
</style>
