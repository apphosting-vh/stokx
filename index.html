<script>
/* ══════════════════════════════════════════════════════════════════════
   ALWAYS-FRESH STRATEGY
   ══════════════════════════════════════════════════════════════════════ */
(function(){
  var _selfCheckDone=false;
  function selfVersionCheck(){
    if(_selfCheckDone||!navigator.onLine)return;
    _selfCheckDone=true;
    var currentVer=(window.__STOX_APP_VERSION||'');
    fetch(location.href,{cache:'reload',method:'GET'})
      .then(function(r){return r.text();})
      .then(function(html){
        var m=html.match(/APP_VERSION\s*=\s*"([^"]+)"/);
        if(m&&m[1]&&currentVer&&m[1]!==currentVer){
          window.dispatchEvent(new CustomEvent('stox:update-ready'));
        }
      })
      .catch(function(){});
  }
  window.addEventListener('load',function(){setTimeout(selfVersionCheck,2000);});
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){_selfCheckDone=false;selfVersionCheck();}
  });
  window.addEventListener('online',function(){_selfCheckDone=false;selfVersionCheck();});

  if(!('serviceWorker' in navigator))return;
  window.__swReg=null;
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js',{scope:'./'})
      .then(function(reg){
        window.__swReg=reg;
        function notifyUpdateReady(){window.dispatchEvent(new CustomEvent('stox:update-ready'));}
        if(reg.waiting)notifyUpdateReady();
        reg.addEventListener('updatefound',function(){
          var nw=reg.installing;if(!nw)return;
          nw.addEventListener('statechange',function(){
            if(nw.state==='installed'&&navigator.serviceWorker.controller)notifyUpdateReady();
          });
        });
        function swUpdate(){if(navigator.onLine)reg.update().catch(function(){});}
        swUpdate();
        document.addEventListener('visibilitychange',function(){
          if(document.visibilityState==='visible')swUpdate();
        });
        window.addEventListener('online',swUpdate);
        setInterval(swUpdate,10*60*1000);
        navigator.serviceWorker.addEventListener('controllerchange',function(){
          if(!window.__swReloaded){window.__swReloaded=true;window.location.reload();}
        });
      })
      .catch(function(){});
  });
}());
</script>

<script>
/* ══════════════════════════════════════════════════════════════════════
   APP PROTECTION LAYER
   ══════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  if(window.self!==window.top){
    document.documentElement.innerHTML='';
    try{window.top.location=window.self.location;}catch(e){}
    throw new Error('Embedding blocked');
  }
  window.addEventListener('DOMContentLoaded',function(){
    var TRUSTED=['cdnjs.cloudflare.com','fonts.googleapis.com','fonts.gstatic.com','accounts.google.com'];
    var obs=new MutationObserver(function(muts){
      muts.forEach(function(m){
        m.addedNodes.forEach(function(node){
          if(node.nodeName==='SCRIPT'&&node.src){
            var trusted=TRUSTED.some(function(d){return node.src.indexOf(d)!==-1;});
            if(!trusted)node.remove();
          }
        });
      });
    });
    obs.observe(document.documentElement,{childList:true,subtree:true});
  });
})();
</script>

<style>
/* ══════════════════════════════════════════════════════════════════════
   StoX — Global Styles & Theme Tokens
   ══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html{
  background:#0a0c10;
  -webkit-tap-highlight-color:transparent;
}
body{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  overscroll-behavior:none;
  min-height:100dvh;
  -webkit-user-select:text;
  user-select:text;
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px}

.card-container,.stat-card{contain:layout style}
.scroll-list{content-visibility:auto;contain-intrinsic-size:auto 500px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

:root{
  --font-body:'Inter',sans-serif;
  --font-heading:'Manrope',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --fs-xs:10px;--fs-sm:12px;--fs-base:14px;--fs-lg:18px;--fs-xl:24px;--fs-2xl:32px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;
  --r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-pill:999px;
}
.tabular{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ════════════════════════════════════════════════
   DARK THEME (default)
   ════════════════════════════════════════════════ */
html[data-theme="dark"]{
  --bg:#0a0c10;--bg2:#0e1116;--bg3:#13161c;--bg4:#181c24;--bg5:#1e232c;
  --border:#20242c;--border2:#282d37;--border3:#333944;
  --text:rgba(255,255,255,.94);--text2:rgba(255,255,255,.78);--text3:rgba(255,255,255,.62);
  --text4:rgba(255,255,255,.46);--text5:rgba(255,255,255,.34);--text6:rgba(255,255,255,.24);
  --accent:#4c8dd9;--accent2:#3a72b5;
  --accentbg:rgba(76,141,217,.15);--accentbg2:rgba(76,141,217,.07);
  --accentbg3:rgba(76,141,217,.10);--accentbg4:rgba(76,141,217,.05);
  --accentbg5:rgba(76,141,217,.22);
  --profit:#20c46a;--profitbg:rgba(32,196,106,.12);--profitborder:rgba(32,196,106,.3);
  --loss:#f0473f;--lossbg:rgba(240,71,63,.12);--lossborder:rgba(240,71,63,.3);
  --warn:#e0a527;--warnbg:rgba(224,165,39,.12);--warnborder:rgba(224,165,39,.3);
  --info:#4a8fe0;--infobg:rgba(74,143,224,.12);--infoborder:rgba(74,143,224,.3);
  --sidebar:linear-gradient(180deg,#0e1218,#0a0c10);
  --card:#13161c;--card2:#0e1116;--inp-bg:#13161c;--inp-opt:#181c24;
  --scrollbar:#333944;--scrollbar2:#454c59;--scrolltrack:#0e1116;
  --mr-hover:#181c24;--modal-bg:#13161c;--overlay:rgba(4,5,7,.78);
  --shadow-sm:0 1px 2px rgba(0,0,0,.24);--shadow-md:0 6px 20px rgba(0,0,0,.28);--shadow-lg:0 16px 48px rgba(0,0,0,.4);
}

/* ════════════════════════════════════════════════
   LIGHT THEME
   ════════════════════════════════════════════════ */
html[data-theme="light"]{
  --bg:#f7f7f5;--bg2:#efefec;--bg3:#ffffff;--bg4:#f9f9f7;--bg5:#f1f1ee;
  --border:#e2e1dc;--border2:#eaeae6;--border3:#d2d1ca;
  --text:#14161a;--text2:#2b2e34;--text3:#4a4e57;
  --text4:#6c707a;--text5:#8d919a;--text6:#b4b7be;
  --accent:#2e5fa0;--accent2:#244a80;
  --accentbg:rgba(46,95,160,.10);--accentbg2:rgba(46,95,160,.05);
  --accentbg3:rgba(46,95,160,.08);--accentbg4:rgba(46,95,160,.04);
  --accentbg5:rgba(46,95,160,.16);
  --profit:#178a4c;--profitbg:rgba(23,138,76,.09);--profitborder:rgba(23,138,76,.26);
  --loss:#c7362d;--lossbg:rgba(199,54,45,.09);--lossborder:rgba(199,54,45,.26);
  --warn:#b07c15;--warnbg:rgba(176,124,21,.09);--warnborder:rgba(176,124,21,.26);
  --info:#2f65b0;--infobg:rgba(47,101,176,.09);--infoborder:rgba(47,101,176,.26);
  --sidebar:linear-gradient(180deg,#14161a,#0a0b0d);
  --card:#ffffff;--card2:#f9f9f7;--inp-bg:#ffffff;--inp-opt:#f9f9f7;
  --scrollbar:#d2d1ca;--scrollbar2:#b4b7be;--scrolltrack:#efefec;
  --mr-hover:#efefec;--modal-bg:#ffffff;--overlay:rgba(20,22,26,.46);
  --shadow-sm:0 1px 2px rgba(20,20,15,.05);--shadow-md:0 6px 20px rgba(20,20,15,.07);--shadow-lg:0 16px 40px rgba(20,20,15,.10);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;transition:background .3s,color .3s}
body{background:var(--bg);color:var(--text);font-family:var(--font-body)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--scrolltrack)}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--scrollbar2)}

.inp{width:100%;box-sizing:border-box;background:var(--inp-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 14px;font-family:var(--font-body);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s,background .3s,color .3s}
.inp:hover{border-color:var(--border3)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg3)}
.inp::placeholder{color:var(--text5)}

/* ── Shared card styles ── */
.stx-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-sm);transition:box-shadow .25s,border-color .25s,transform .2s}
.stx-card:hover{border-color:var(--border2);box-shadow:var(--shadow-md)}

.stx-statcard{animation:stxFadeIn .42s ease both;transition:transform .18s ease,box-shadow .25s ease,border-color .2s ease}
.stx-statcard:nth-child(1){animation-delay:0ms}
.stx-statcard:nth-child(2){animation-delay:60ms}
.stx-statcard:nth-child(3){animation-delay:120ms}
.stx-statcard:nth-child(4){animation-delay:180ms}
.stx-statcard:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:var(--border3)}
.stx-statcard[data-trend="up"]{border-left:2.5px solid var(--profit)}
.stx-statcard[data-trend="down"]{border-left:2.5px solid var(--loss)}
.stx-statcard[data-trend="neutral"]{border-left:2.5px solid var(--border3)}

/* ── Buttons ── */
.stx-btn{padding:8px 16px;border-radius:var(--r-sm);cursor:pointer;font-family:var(--font-body);font-size:13px;font-weight:600;letter-spacing:.1px;transition:all .15s;border:1px solid transparent;white-space:nowrap}
.stx-btn:hover:not([disabled]){transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.stx-btn:active:not([disabled]){transform:translateY(0) scale(.98)}
.stx-btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accentbg3)}
.stx-btn:disabled{opacity:.38;cursor:not-allowed}
.stx-btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.stx-btn-primary:hover:not([disabled]){background:var(--accent2)}
.stx-btn-ghost{background:transparent;color:var(--text4);border-color:var(--border)}
.stx-btn-ghost:hover:not([disabled]){background:var(--accentbg2);color:var(--accent);border-color:var(--accentbg5)}
select.inp option{background:var(--inp-opt)}
textarea.inp{resize:vertical}
.inp:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg3)}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Tags/Badges ── */
.stx-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);font-size:10.5px;font-weight:600;letter-spacing:.3px;font-family:var(--font-mono);background:transparent}
.stx-badge::before{content:'';width:5px;height:5px;border-radius:50%;flex:none}
.stx-profit{color:var(--profit);border:1px solid var(--profitborder)}
.stx-profit::before{background:var(--profit)}
.stx-loss{color:var(--loss);border:1px solid var(--lossborder)}
.stx-loss::before{background:var(--loss)}
.stx-warn{color:var(--warn);border:1px solid var(--warnborder)}
.stx-warn::before{background:var(--warn)}
.stx-info{color:var(--info);border:1px solid var(--infoborder)}
.stx-info::before{background:var(--info)}

/* ── Tables ── */
.stx-table{width:100%;border-collapse:collapse;font-size:13px}
.stx-table th{text-align:left;padding:10px 14px;font-size:10px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.8px;background:var(--bg4);border-bottom:1px solid var(--border2)}
.stx-table td{padding:10px 14px;border-bottom:1px solid var(--border2);font-family:var(--font-body);font-size:13px;vertical-align:middle;color:var(--text3)}
.stx-table td.num,.stx-table td[data-num]{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.stx-table tr:last-child td{border-bottom:none}
.stx-table tr:hover td{background:var(--accentbg2)}

/* ── Mobile bottom nav ── */
.stx-botnav{display:none}
@media(max-width:768px){
  .stx-botnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:900;
    background:var(--bg3);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -4px 20px rgba(0,0,0,.10);
  }
  .stx-botnav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:transparent;border:none;cursor:pointer;padding:5px 2px;border-radius:10px;
    color:var(--text5);font-family:var(--font-body);font-size:9.5px;font-weight:600;
    letter-spacing:.1px;transition:color .18s,background .18s;min-width:0;
  }
  .stx-botnav-item.active{color:var(--accent)}
  .stx-botnav-item.active svg{transform:scale(1.1)}
  .stx-botnav-item:active{background:var(--accentbg2)}
  .stx-has-botnav{padding-bottom:76px!important}
}

/* ── Modal ── */
.modal-bd{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--overlay);z-index:1000;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:stxFadeIn .3s ease both}
@media(max-width:768px){
  .modal-bd{left:0!important}
  .modal-bd .fu{width:100%;max-width:100%!important;max-height:calc(100dvh - 48px);overflow-y:auto;-webkit-overflow-scrolling:touch}
}

/* ── Selection system ── */
::selection{background:var(--accentbg5);color:var(--text)}
::-moz-selection{background:var(--accentbg5);color:var(--text)}

/* ── Animations ── */
@keyframes stxFadeIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes stxSlideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes stxSpin{to{transform:rotate(360deg)}}
@keyframes stxShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes stxPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.45);opacity:1}}
@keyframes stxLineDraw{to{stroke-dashoffset:0}}

.stx-fu{animation:stxFadeIn .35s ease forwards}
.stx-si{animation:stxSlideIn .25s ease forwards}

/* ── Toast host ── */
.stx-toast-host{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.stx-toast{display:flex;align-items:center;gap:12px;pointer-events:auto;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:11px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:var(--font-body);font-size:13px;color:var(--text);animation:stxFadeIn .25s ease}
.stx-toast-msg{flex:1;min-width:0}
.stx-toast-close{background:transparent;border:none;color:var(--text5);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}

/* ── Sidebar ── */
.stx-sidebar{transition:width .2s cubic-bezier(.4,0,.2,1),min-width .2s cubic-bezier(.4,0,.2,1)}

/* ── Responsive modals ── */
@media(max-width:420px){
  .modal-bd{padding:8px 4px!important}
  .modal-bd .fu{padding:16px 12px!important}
}

/* ── Chart area ── */
.stx-chart-line{transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1);stroke-dasharray:1400;stroke-dashoffset:1400;animation:stxLineDraw 1.1s cubic-bezier(.4,0,.2,1) forwards}

/* ── Reports tabs scrollbar hiding ── */
.reports-tabs-scroll::-webkit-scrollbar{display:none}
.reports-tabs-scroll{scrollbar-width:none}

/* ── Mobile scroll tables ── */
.mobile-scroll-table{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:9px}

/* ── Grid helpers ── */
.grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid-2col{grid-template-columns:1fr}}

/* ── Theme crossfade ── */
html,body,.stx-card,.stx-statcard,.stx-btn,.inp,.stx-botnav,.stx-botnav-item,
.stx-sidebar,.stx-toast,.modal-bd,.fu,input,select,button,textarea{
  transition:background-color .35s ease,color .35s ease,border-color .35s ease,box-shadow .35s ease
}

/* ── Tr hover utility ── */
.tr:hover{background:var(--accentbg2) !important}

/* ── Responsive mobile content ── */
@media(max-width:768px){
  .mobile-content-panel{padding:14px 10px 32px !important}
}

/* ── Print ── */
@media print{
  html:not([data-stox-printing]) body *{visibility:hidden!important}
  html:not([data-stox-printing]) body::after{
    visibility:visible!important;content:"Printing is disabled for this application.";
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:20px;font-family:sans-serif;color:#333;
  }
}
</style>

/* ═══════════════════════════════════════════════════════
   StoX — Splash Screen v2
   ═══════════════════════════════════════════════════════ */

@keyframes sp-bgshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

@keyframes sp-glow{0%,100%{filter:drop-shadow(0 0 6px rgba(76,141,217,.3))}50%{filter:drop-shadow(0 0 14px rgba(76,141,217,.55))}}
@keyframes sp-bar{from{width:0}to{width:100%}}
@keyframes sp-dot-float{0%,100%{transform:translateY(0) translateX(0);opacity:.25}25%{transform:translateY(-18px) translateX(8px);opacity:.5}50%{transform:translateY(-8px) translateX(-6px);opacity:.35}75%{transform:translateY(-22px) translateX(4px);opacity:.55}}
@keyframes sp-orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes sp-line-pulse{0%,100%{opacity:.12}50%{opacity:.25}}

#stox-splash{
  position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(135deg,#f9f9f7 0%,#f2f2ee 30%,#efefec 60%,#f7f7f5 100%);
  background-size:200% 200%;animation:sp-bgshift 8s ease-in-out infinite;
  font-family:'Manrope','Inter',system-ui,sans-serif;
}
#stox-splash::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 50% 45% at 50% 40%,rgba(76,141,217,.08) 0%,transparent 70%),
    radial-gradient(ellipse 30% 30% at 20% 70%,rgba(58,114,181,.05) 0%,transparent 60%),
    radial-gradient(ellipse 25% 25% at 80% 25%,rgba(47,101,176,.03) 0%,transparent 60%);
  pointer-events:none;
}
#stox-splash::after{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(20,22,26,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(20,22,26,.025) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,black 20%,transparent 100%);
  pointer-events:none;opacity:.6;
}

/* ── Animated chart line ── */
.sp-chart-line{
  position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;
  animation:sp-fadeup .8s .3s ease both;
}
.sp-chart-path{
  fill:none;stroke:url(#sp-gradient);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1600;stroke-dashoffset:1600;
  animation:sp-draw 2.8s .5s cubic-bezier(.4,0,.2,1) forwards;
}
.sp-chart-area{
  fill:url(#sp-area-gradient);opacity:0;
  animation:sp-fadeup 1.2s 2s ease both;
}
.sp-chart-dot{
  fill:#4c8dd9;opacity:0;
  animation:sp-fadeup .4s 2.6s ease both,sp-pulse 2s 3s ease-in-out infinite;
}

/* ── Background floating dots ── */
.sp-bg-dots{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sp-bg-dot{
  position:absolute;border-radius:50%;background:rgba(76,141,217,.3);
}
.sp-bg-dot:nth-child(1){width:5px;height:5px;top:15%;left:12%;animation:sp-dot-float 6s ease-in-out infinite}
.sp-bg-dot:nth-child(2){width:3px;height:3px;top:28%;left:82%;animation:sp-dot-float 7.5s .8s ease-in-out infinite;background:rgba(47,101,176,.25)}
.sp-bg-dot:nth-child(3){width:4px;height:4px;top:65%;left:25%;animation:sp-dot-float 8s 1.5s ease-in-out infinite}
.sp-bg-dot:nth-child(4){width:3px;height:3px;top:72%;left:75%;animation:sp-dot-float 6.5s .4s ease-in-out infinite;background:rgba(58,114,181,.25)}
.sp-bg-dot:nth-child(5){width:4px;height:4px;top:42%;left:90%;animation:sp-dot-float 7s 2s ease-in-out infinite}
.sp-bg-dot:nth-child(6){width:3px;height:3px;top:85%;left:55%;animation:sp-dot-float 9s 1s ease-in-out infinite;background:rgba(47,101,176,.2)}
.sp-bg-dot:nth-child(7){width:5px;height:5px;top:10%;left:60%;animation:sp-dot-float 7.5s 1.2s ease-in-out infinite}
.sp-bg-dot:nth-child(8){width:3px;height:3px;top:50%;left:8%;animation:sp-dot-float 8.5s .6s ease-in-out infinite;background:rgba(58,114,181,.2)}

/* ── Connecting lines between dots ── */
.sp-lines{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sp-lines svg{width:100%;height:100%}
.sp-line{stroke:rgba(20,22,26,.07);stroke-width:1;animation:sp-line-pulse 4s ease-in-out infinite}
.sp-line:nth-child(2){animation-delay:1.3s}
.sp-line:nth-child(3){animation-delay:2.6s}

/* ── Center content ── */
.sp-center{
  position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
}

/* ── Logo mark ── */
.sp-logo{
  width:72px;height:72px;border-radius:16px;position:relative;
  background:linear-gradient(135deg,#1a1d23 0%,#0e1014 100%);
  border:1px solid rgba(76,141,217,.3);
  display:flex;align-items:center;justify-content:center;
  animation:sp-scale .6s .15s ease both;opacity:0;
  box-shadow:0 8px 32px rgba(20,20,15,.14),0 2px 8px rgba(20,20,15,.08);
  margin-bottom:28px;
}
.sp-logo::before{
  content:'';position:absolute;inset:-8px;border-radius:22px;
  border:1px solid rgba(76,141,217,.16);
  animation:sp-ring 2.5s .8s ease-out infinite;
}
.sp-logo::after{
  content:'';position:absolute;inset:-16px;border-radius:26px;
  border:1px solid rgba(76,141,217,.08);
  animation:sp-ring 2.5s 1.4s ease-out infinite;
}
.sp-logo-letter{
  font-size:28px;font-weight:800;color:#4c8dd9;line-height:1;
  font-family:'Manrope',system-ui,sans-serif;
}

/* ── Wordmark ── */
.sp-wordmark{
  display:flex;gap:1px;margin-bottom:8px;
}
.sp-wm-char{
  font-size:40px;font-weight:800;color:#14161a;letter-spacing:-1px;line-height:1;
  font-family:'Manrope',system-ui,sans-serif;
  opacity:0;animation:sp-char .45s ease both;
}
.sp-wm-char:nth-child(1){animation-delay:.25s}
.sp-wm-char:nth-child(2){animation-delay:.32s}
.sp-wm-char:nth-child(3){animation-delay:.39s}
.sp-wm-char.accent{
  background:linear-gradient(135deg,#4c8dd9,#2e5fa0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

/* ── Tagline ── */
.sp-tagline{
  font-size:11px;color:#6c707a;letter-spacing:3px;text-transform:uppercase;
  font-weight:600;opacity:0;animation:sp-fadeup .5s .6s ease both;
  font-family:'Inter','Manrope',system-ui,sans-serif;
}

/* ── Progress ── */
.sp-progress{
  margin-top:44px;width:180px;height:2px;background:rgba(76,141,217,.14);
  border-radius:2px;overflow:hidden;opacity:0;animation:sp-fadeup .4s .85s ease both;
}
.sp-progress-fill{
  height:100%;border-radius:2px;width:0;
  background:linear-gradient(90deg,rgba(76,141,217,.5),#4c8dd9,#2e5fa0);
  animation:sp-bar 2.6s .95s cubic-bezier(.4,0,.2,1) forwards;
  box-shadow:0 0 10px rgba(76,141,217,.3);
}
.sp-label{
  margin-top:14px;font-size:10px;color:#8d919a;letter-spacing:2.2px;
  text-transform:uppercase;font-weight:600;font-family:'Inter','Manrope',system-ui,sans-serif;
  opacity:0;animation:sp-fadeup .4s 1s ease both;
}

/* ── Orbital ring ── */
.sp-orbit{
  position:absolute;width:120px;height:120px;top:50%;left:50%;
  margin:-60px 0 0 -60px;border-radius:50%;pointer-events:none;
  opacity:0;animation:sp-fadeup .6s .5s ease both,sp-orbit 12s .5s linear infinite;
}
.sp-orbit-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1px dashed rgba(76,141,217,.14);
}
.sp-orbit-node{
  position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;
  border-radius:50%;background:#4c8dd9;
  box-shadow:0 0 8px 2px rgba(76,141,217,.35);
}
</style>
