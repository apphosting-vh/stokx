<script>
/* ══════════════════════════════════════════════════════════════════════
   ALWAYS-FRESH STRATEGY
   ══════════════════════════════════════════════════════════════════════ */
(function(){
  var _selfCheckDone=false;
  function selfVersionCheck(){
    if(_selfCheckDone||!navigator.onLine)return;
    _selfCheckDone=true;
    var currentVer=(window.__STOX_APP_VERSION||'');
    fetch(location.href,{cache:'reload',method:'GET'})
      .then(function(r){return r.text();})
      .then(function(html){
        var m=html.match(/APP_VERSION\s*=\s*"([^"]+)"/);
        if(m&&m[1]&&currentVer&&m[1]!==currentVer){
          window.dispatchEvent(new CustomEvent('stox:update-ready'));
        }
      })
      .catch(function(){});
  }
  window.addEventListener('load',function(){setTimeout(selfVersionCheck,2000);});
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){_selfCheckDone=false;selfVersionCheck();}
  });
  window.addEventListener('online',function(){_selfCheckDone=false;selfVersionCheck();});

  if(!('serviceWorker' in navigator))return;
  window.__swReg=null;
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js',{scope:'./'})
      .then(function(reg){
        window.__swReg=reg;
        function notifyUpdateReady(){window.dispatchEvent(new CustomEvent('stox:update-ready'));}
        if(reg.waiting)notifyUpdateReady();
        reg.addEventListener('updatefound',function(){
          var nw=reg.installing;if(!nw)return;
          nw.addEventListener('statechange',function(){
            if(nw.state==='installed'&&navigator.serviceWorker.controller)notifyUpdateReady();
          });
        });
        function swUpdate(){if(navigator.onLine)reg.update().catch(function(){});}
        swUpdate();
        document.addEventListener('visibilitychange',function(){
          if(document.visibilityState==='visible')swUpdate();
        });
        window.addEventListener('online',swUpdate);
        setInterval(swUpdate,10*60*1000);
        navigator.serviceWorker.addEventListener('controllerchange',function(){
          if(!window.__swReloaded){window.__swReloaded=true;window.location.reload();}
        });
      })
      .catch(function(){});
  });
}());
</script>

<script>
/* ══════════════════════════════════════════════════════════════════════
   APP PROTECTION LAYER
   ══════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  if(window.self!==window.top){
    document.documentElement.innerHTML='';
    try{window.top.location=window.self.location;}catch(e){}
    throw new Error('Embedding blocked');
  }
  window.addEventListener('DOMContentLoaded',function(){
    var TRUSTED=['cdnjs.cloudflare.com','fonts.googleapis.com','fonts.gstatic.com','accounts.google.com'];
    var obs=new MutationObserver(function(muts){
      muts.forEach(function(m){
        m.addedNodes.forEach(function(node){
          if(node.nodeName==='SCRIPT'&&node.src){
            var trusted=TRUSTED.some(function(d){return node.src.indexOf(d)!==-1;});
            if(!trusted)node.remove();
          }
        });
      });
    });
    obs.observe(document.documentElement,{childList:true,subtree:true});
  });
})();
</script>

<style>
/* ══════════════════════════════════════════════════════════════════════
   StoX — Global Styles & Theme Tokens
   ══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html{
  background:#06090f;
  -webkit-tap-highlight-color:transparent;
}
body{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  overscroll-behavior:none;
  min-height:100dvh;
  -webkit-user-select:text;
  user-select:text;
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px}

.card-container,.stat-card{contain:layout style}
.scroll-list{content-visibility:auto;contain-intrinsic-size:auto 500px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

:root{
  --font-body:'DM Sans',sans-serif;
  --font-heading:'Sora',sans-serif;
  --font-mono:'DM Mono',monospace;
  --fs-xs:10px;--fs-sm:12px;--fs-base:14px;--fs-lg:18px;--fs-xl:24px;--fs-2xl:32px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;
  --r-sm:8px;--r-md:10px;--r-lg:14px;--r-xl:18px;--r-pill:999px;
}

/* ════════════════════════════════════════════════
   DARK THEME (default)
   ════════════════════════════════════════════════ */
html[data-theme="dark"]{
  --bg:#06090f;--bg2:#0c1118;--bg3:#111824;--bg4:#161f2e;--bg5:#1c2738;
  --border:#1e2d42;--border2:#263852;--border3:#2e4568;
  --text:rgba(255,255,255,.92);--text2:rgba(255,255,255,.80);--text3:rgba(255,255,255,.65);
  --text4:rgba(255,255,255,.50);--text5:rgba(255,255,255,.38);--text6:rgba(255,255,255,.28);
  --accent:#10b981;--accent2:#059669;
  --accentbg:rgba(16,185,129,.15);--accentbg2:rgba(16,185,129,.08);
  --accentbg3:rgba(16,185,129,.10);--accentbg4:rgba(16,185,129,.06);
  --accentbg5:rgba(16,185,129,.20);
  --profit:#10b981;--profitbg:rgba(16,185,129,.12);--profitborder:rgba(16,185,129,.3);
  --loss:#ef4444;--lossbg:rgba(239,68,68,.12);--lossborder:rgba(239,68,68,.3);
  --warn:#f59e0b;--warnbg:rgba(245,158,11,.12);--warnborder:rgba(245,158,11,.3);
  --info:#3b82f6;--infobg:rgba(59,130,246,.12);--infoborder:rgba(59,130,246,.3);
  --sidebar:linear-gradient(180deg,#0c1420,#06090f);
  --card:#111824;--card2:#0c1118;--inp-bg:#111824;--inp-opt:#161f2e;
  --scrollbar:#2e4568;--scrollbar2:#3e5a80;--scrolltrack:#0c1118;
  --mr-hover:#161f2e;--modal-bg:#111824;--overlay:rgba(0,0,0,.72);
  --shadow-sm:0 1px 3px rgba(0,0,0,.20);--shadow-md:0 4px 16px rgba(0,0,0,.25);--shadow-lg:0 8px 32px rgba(0,0,0,.35);
}

/* ════════════════════════════════════════════════
   LIGHT THEME
   ════════════════════════════════════════════════ */
html[data-theme="light"]{
  --bg:#f0f4fa;--bg2:#e4ebf5;--bg3:#ffffff;--bg4:#f8fafc;--bg5:#eef2f8;
  --border:#d1d9e6;--border2:#dde4ee;--border3:#c4d0e0;
  --text:#0a1628;--text2:#1a2744;--text3:#2e3f5e;
  --text4:#475a7a;--text5:#6b7e9e;--text6:#94a3be;
  --accent:#059669;--accent2:#047857;
  --accentbg:rgba(5,150,105,.10);--accentbg2:rgba(5,150,105,.05);
  --accentbg3:rgba(5,150,105,.08);--accentbg4:rgba(5,150,105,.04);
  --accentbg5:rgba(5,150,105,.15);
  --profit:#059669;--profitbg:rgba(5,150,105,.10);--profitborder:rgba(5,150,105,.28);
  --loss:#dc2626;--lossbg:rgba(220,38,38,.08);--lossborder:rgba(220,38,38,.28);
  --warn:#d97706;--warnbg:rgba(217,119,6,.08);--warnborder:rgba(217,119,6,.28);
  --info:#2563eb;--infobg:rgba(37,99,235,.08);--infoborder:rgba(37,99,235,.28);
  --sidebar:linear-gradient(180deg,#0f172a,#0a1628);
  --card:#ffffff;--card2:#f8fafc;--inp-bg:#ffffff;--inp-opt:#f8fafc;
  --scrollbar:#c4d0e0;--scrollbar2:#a0b0c8;--scrolltrack:#e4ebf5;
  --mr-hover:#e4ebf5;--modal-bg:#ffffff;--overlay:rgba(0,0,0,.52);
  --shadow-sm:0 1px 3px rgba(0,0,0,.04);--shadow-md:0 4px 16px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.08);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;transition:background .3s,color .3s}
body{background:var(--bg);color:var(--text);font-family:var(--font-body)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--scrolltrack)}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--scrollbar2)}

.inp{width:100%;box-sizing:border-box;background:var(--inp-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 14px;font-family:var(--font-body);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s,background .3s,color .3s}
.inp:hover{border-color:var(--border3)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg3)}
.inp::placeholder{color:var(--text5)}

/* ── Shared card styles ── */
.stx-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-sm);transition:box-shadow .25s,border-color .25s,transform .2s}
.stx-card:hover{border-color:var(--border2);box-shadow:var(--shadow-md)}

.stx-statcard{animation:stxFadeIn .42s ease both;transition:transform .2s ease,box-shadow .25s ease,border-color .2s ease}
.stx-statcard:nth-child(1){animation-delay:0ms}
.stx-statcard:nth-child(2){animation-delay:60ms}
.stx-statcard:nth-child(3){animation-delay:120ms}
.stx-statcard:nth-child(4){animation-delay:180ms}
.stx-statcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border3)}

/* ── Buttons ── */
.stx-btn{padding:8px 16px;border-radius:var(--r-sm);cursor:pointer;font-family:var(--font-body);font-size:13px;font-weight:600;transition:all .15s;border:1px solid transparent;white-space:nowrap}
.stx-btn:hover:not([disabled]){transform:translateY(-1px);box-shadow:var(--shadow-sm);filter:saturate(1.05)}
.stx-btn:active:not([disabled]){transform:translateY(0) scale(.98)}
.stx-btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accentbg3)}
.stx-btn:disabled{opacity:.38;cursor:not-allowed}
.stx-btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.stx-btn-primary:hover:not([disabled]){background:var(--accent2)}
.stx-btn-ghost{background:transparent;color:var(--text4);border-color:var(--border)}
.stx-btn-ghost:hover:not([disabled]){background:var(--accentbg2);color:var(--accent);border-color:var(--accentbg5)}
select.inp option{background:var(--inp-opt)}
textarea.inp{resize:vertical}
.inp:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg3)}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Tags/Badges ── */
.stx-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:600;letter-spacing:.2px}
.stx-profit{color:var(--profit);background:var(--profitbg);border:1px solid var(--profitborder)}
.stx-loss{color:var(--loss);background:var(--lossbg);border:1px solid var(--lossborder)}
.stx-warn{color:var(--warn);background:var(--warnbg);border:1px solid var(--warnborder)}
.stx-info{color:var(--info);background:var(--infobg);border:1px solid var(--infoborder)}

/* ── Tables ── */
.stx-table{width:100%;border-collapse:collapse;font-size:13px}
.stx-table th{text-align:left;padding:10px 14px;font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;background:var(--bg4);border-bottom:2px solid var(--border)}
.stx-table td{padding:10px 14px;border-bottom:1px solid var(--border2);font-family:var(--font-body);font-size:13px;vertical-align:middle;color:var(--text3)}
.stx-table tr:last-child td{border-bottom:none}
.stx-table tr:hover td{background:var(--accentbg2)}

/* ── Mobile bottom nav ── */
.stx-botnav{display:none}
@media(max-width:768px){
  .stx-botnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:900;
    background:var(--bg3);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -4px 20px rgba(0,0,0,.10);
  }
  .stx-botnav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:transparent;border:none;cursor:pointer;padding:5px 2px;border-radius:10px;
    color:var(--text5);font-family:var(--font-body);font-size:9.5px;font-weight:600;
    letter-spacing:.1px;transition:color .18s,background .18s;min-width:0;
  }
  .stx-botnav-item.active{color:var(--accent)}
  .stx-botnav-item.active svg{transform:scale(1.16);filter:drop-shadow(0 0 4px var(--accentbg5))}
  .stx-botnav-item:active{background:var(--accentbg2)}
  .stx-has-botnav{padding-bottom:76px!important}
}

/* ── Modal ── */
.modal-bd{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--overlay);z-index:1000;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:stxFadeIn .3s ease both}
@media(max-width:768px){
  .modal-bd{left:0!important}
  .modal-bd .fu{width:100%;max-width:100%!important;max-height:calc(100dvh - 48px);overflow-y:auto;-webkit-overflow-scrolling:touch}
}

/* ── Selection system ── */
::selection{background:var(--accentbg5);color:var(--accent)}
::-moz-selection{background:var(--accentbg5);color:var(--accent)}

/* ── Animations ── */
@keyframes stxFadeIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes stxSlideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes stxSpin{to{transform:rotate(360deg)}}
@keyframes stxShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes stxPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.45);opacity:1}}
@keyframes stxLineDraw{to{stroke-dashoffset:0}}

.stx-fu{animation:stxFadeIn .35s ease forwards}
.stx-si{animation:stxSlideIn .25s ease forwards}

/* ── Toast host ── */
.stx-toast-host{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.stx-toast{display:flex;align-items:center;gap:12px;pointer-events:auto;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:11px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:var(--font-body);font-size:13px;color:var(--text);animation:stxFadeIn .25s ease}
.stx-toast-msg{flex:1;min-width:0}
.stx-toast-close{background:transparent;border:none;color:var(--text5);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}

/* ── Sidebar ── */
.stx-sidebar{transition:width .2s cubic-bezier(.4,0,.2,1),min-width .2s cubic-bezier(.4,0,.2,1)}

/* ── Responsive modals ── */
@media(max-width:420px){
  .modal-bd{padding:8px 4px!important}
  .modal-bd .fu{padding:16px 12px!important}
}

/* ── Chart area ── */
.stx-chart-line{transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1);stroke-dasharray:1400;stroke-dashoffset:1400;animation:stxLineDraw 1.1s cubic-bezier(.4,0,.2,1) forwards}

/* ── Reports tabs scrollbar hiding ── */
.reports-tabs-scroll::-webkit-scrollbar{display:none}
.reports-tabs-scroll{scrollbar-width:none}

/* ── Mobile scroll tables ── */
.mobile-scroll-table{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:9px}

/* ── Grid helpers ── */
.grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid-2col{grid-template-columns:1fr}}

/* ── Theme crossfade ── */
html,body,.stx-card,.stx-statcard,.stx-btn,.inp,.stx-botnav,.stx-botnav-item,
.stx-sidebar,.stx-toast,.modal-bd,.fu,input,select,button,textarea{
  transition:background-color .35s ease,color .35s ease,border-color .35s ease,box-shadow .35s ease
}

/* ── Tr hover utility ── */
.tr:hover{background:var(--accentbg2) !important}

/* ── Responsive mobile content ── */
@media(max-width:768px){
  .mobile-content-panel{padding:14px 10px 32px !important}
}

/* ── Print ── */
@media print{
  html:not([data-stox-printing]) body *{visibility:hidden!important}
  html:not([data-stox-printing]) body::after{
    visibility:visible!important;content:"Printing is disabled for this application.";
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:20px;font-family:sans-serif;color:#333;
  }
}
</style>

<body>
<div id="root"><style>
/* ═══════════════════════════════════════════════════════
   StoX — Splash Screen
   ═══════════════════════════════════════════════════════ */
@keyframes sx-fadein{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes sx-logopop{0%{opacity:0;transform:scale(.82) translateY(10px)}60%{transform:scale(1.04)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes sx-shimmer{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes sx-glow{0%,100%{box-shadow:0 0 24px 4px rgba(16,185,129,.28),0 0 60px 0 rgba(16,185,129,.08)}50%{box-shadow:0 0 40px 8px rgba(16,185,129,.45),0 0 90px 4px rgba(5,150,105,.14)}}
@keyframes sx-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes sx-orbit{from{transform:rotate(0deg) translateX(52px)}to{transform:rotate(360deg) translateX(52px)}}

#stox-splash{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#06090f;overflow:hidden;font-family:'Sora',sans-serif;z-index:9999;
}
#stox-splash::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(16,185,129,.055) 0%,transparent 70%),
    radial-gradient(ellipse 40% 35% at 30% 20%,rgba(5,150,105,.04) 0%,transparent 60%);
  pointer-events:none;
}
#stox-splash::after{
  content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(16,185,129,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(16,185,129,.028) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%);
  pointer-events:none;opacity:.6;
}

.sx-orb{
  width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(16,185,129,.22),rgba(5,150,105,.12) 60%,transparent);
  border:1px solid rgba(16,185,129,.28);
  display:flex;align-items:center;justify-content:center;
  animation:sx-glow 3s ease-in-out infinite,sx-float 5s ease-in-out infinite;
  margin-bottom:28px;position:relative;
}
.sx-orb::before{content:'';position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(16,185,129,.12);animation:sx-ripple 2.8s ease-out infinite}
.sx-orb-symbol{font-size:36px;font-weight:900;color:#10b981;text-shadow:0 0 24px rgba(16,185,129,.6),0 0 8px rgba(5,150,105,.4);font-family:'Sora',sans-serif;line-height:1;animation:sx-float 5s ease-in-out infinite}
.sx-orbit-wrap{position:absolute;inset:0;animation:sx-orbit 4s linear infinite;transform-origin:center}
.sx-orbit-dot{position:absolute;top:4px;left:50%;width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 8px 2px rgba(16,185,129,.6);transform:translateX(-50%)}

.sx-wordmark{font-size:36px;font-weight:800;color:#ecfdf5;letter-spacing:-1px;font-family:'Sora',sans-serif;animation:sx-logopop .65s .2s ease both;opacity:0;line-height:1}
.sx-wordmark em{color:#10b981;font-style:normal;text-shadow:0 0 20px rgba(16,185,129,.5)}
.sx-tagline{font-size:11.5px;color:rgba(167,213,195,.55);letter-spacing:3px;text-transform:uppercase;margin-top:8px;font-weight:600;animation:sx-fadein .6s .55s ease both;opacity:0;font-family:'DM Sans',sans-serif}
.sx-progress-wrap{margin-top:40px;width:200px;height:2px;background:rgba(16,185,129,.12);border-radius:2px;overflow:hidden;animation:sx-fadein .4s .8s ease both;opacity:0}
.sx-progress-fill{height:100%;background:linear-gradient(90deg,rgba(16,185,129,.5),#10b981,rgba(5,150,105,.8));border-radius:2px;width:0;animation:sx-progress 2.8s .85s cubic-bezier(.4,0,.6,1) forwards;box-shadow:0 0 8px rgba(16,185,129,.5)}
.sx-label{margin-top:14px;font-size:10.5px;color:rgba(16,185,129,.42);letter-spacing:2.5px;text-transform:uppercase;font-weight:600;font-family:'DM Sans',sans-serif;animation:sx-shimmer 2s ease-in-out infinite,sx-fadein .5s .9s ease both;opacity:0}

.sx-pt{position:absolute;border-radius:50%;background:rgba(16,185,129,.5)}
.sx-pt:nth-child(1){width:4px;height:4px;top:22%;left:18%;animation:sx-p1 5.5s ease-in-out infinite}
.sx-pt:nth-child(2){width:3px;height:3px;top:35%;left:72%;animation:sx-p2 7s ease-in-out infinite;background:rgba(5,150,105,.5)}
.sx-pt:nth-child(3){width:5px;height:5px;top:55%;left:32%;animation:sx-p3 6.5s ease-in-out infinite}
@keyframes sx-p1{0%,100%{transform:translate(0,0);opacity:.6}33%{transform:translate(-14px,-28px);opacity:1}66%{transform:translate(10px,-18px);opacity:.7}}
@keyframes sx-p2{0%,100%{transform:translate(0,0);opacity:.4}40%{transform:translate(18px,-36px);opacity:.9}75%{transform:translate(-8px,-20px);opacity:.6}}
@keyframes sx-p3{0%,100%{transform:translate(0,0);opacity:.5}50%{transform:translate(-20px,-24px);opacity:1}}
</style>
